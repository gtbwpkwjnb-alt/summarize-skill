# sutras.yaml — summarize skill metadata & configuration

name: summarize
version: "10.1.0"
description: |
  用户请求“总结”“总结一下”“总结进度”“复盘”“交接”“handoff”或“summarize”时触发。默认生成证据优先、只读的任务状态或交接报告，并在输出末尾提供操作、优化和行为建议；仅“总结 保存”写入当前项目。可选诊断只报告有证据的风险，不自动判罚或写历史。 Evidence-first Codex summary, handoff, and evidence-backed action recommendations; persistence is explicit and project-local.

author: ZCode (https://github.com/gtbwpkwjnb-alt)
license: MIT
repository: https://github.com/gtbwpkwjnb-alt/summarize-skill

compatibility:
  platforms: [zcode, codebuddy, claude-code, codex, reasonix]
  note: "安装脚本自动检测目标平台并适配安装路径"
  minVersion: "2.0.0"

build:
  include:
    - SKILL.md
    - README.md
    - LICENSE
    - VERSION
    - manifest.json
    - scripts/install.sh
    - scripts/install.ps1
    - references/
    - harvests/

distribution:
  tags:
    - session-management
    - productivity
    - multi-platform
    - agent-skill
    - zcode
    - claude-code
    - handoff
    - evidence-first
    - read-only-default
  category: developer-tools
  github:
    owner: gtbwpkwjnb-alt
    repo: summarize-skill
  install:
    bash: "curl -sL https://raw.githubusercontent.com/gtbwpkwjnb-alt/summarize-skill/master/scripts/install.sh | bash"
    powershell: "iwr https://raw.githubusercontent.com/gtbwpkwjnb-alt/summarize-skill/master/scripts/install.ps1 | iex"
