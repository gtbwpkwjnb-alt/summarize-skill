# sutras.yaml — summarize skill metadata & configuration

name: summarize
version: "8.2.1"
description: |
  当用户发送独立词"总结"或"summarize"时触发（句中不触发）。AI 编程助手的错误免疫系统 + 会话轮转引擎。收割错误、5维分类、单层记忆写入、生成预防规则，并精炼长对话为结构化轮转报告。中英文独立触发。
  Triggered by standalone "总结"/"summarize" only (not mid-sentence). Error immune system + session rotation engine for AI coding agents. Harvests errors, 5-dimension classification, single-layer memory write, generates prevention rules, condenses long conversations into structured rotation reports.

author: ZCode (https://github.com/gtbwpkwjnb-alt)
license: MIT
repository: https://github.com/gtbwpkwjnb-alt/summarize-skill

compatibility:
  platforms: [zcode, codebuddy, claude-code, codex, reasonix]
  note: "安装脚本自动检测目标平台并适配安装路径"
  minVersion: "2.0.0"

build:
  include:
    - SKILL.md
    - README.md
    - LICENSE
    - VERSION
    - manifest.json
    - scripts/install.sh
    - scripts/install.ps1
    - references/
    - harvests/

distribution:
  tags:
    - diagnostics
    - session-management
    - self-evolution
    - productivity
    - multi-platform
    - agent-skill
    - zcode
    - claude-code
    - token-tracking
    - skill-analytics
    - cross-agent
    - git-versioned
    - error-immune
    - error-prevention
    - error-harvesting
    - agent-memory
    - convergence-alert
  category: developer-tools
  github:
    owner: gtbwpkwjnb-alt
    repo: summarize-skill
  install:
    bash: "curl -sL https://raw.githubusercontent.com/gtbwpkwjnb-alt/summarize-skill/master/scripts/install.sh | bash"
    powershell: "iwr https://raw.githubusercontent.com/gtbwpkwjnb-alt/summarize-skill/master/scripts/install.ps1 | iex"
